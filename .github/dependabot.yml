version: 2
# COOLDOWN (2026-11-21, dev.tools security programme S2): version updates wait 3 days (7 for a major)
# after a release before Dependabot opens a PR, so a hijacked release is usually caught and pulled
# before the PR-review routine could merge it (2026: axios live ~1.5-3 h, TanStack, the Trivy and
# actions-cool tag hijacks). Security updates for known vulnerabilities ignore cooldown and arrive at once.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies]
    # One PR for all action bumps — codeql-action pins init/analyze as two
    # steps, and separate per-step PRs create a version mismatch CodeQL rejects
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies]
