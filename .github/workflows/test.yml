name: Test & Deploy

on:
  push:
    branches: [main]
    # Docs-only pushes skip test+deploy. NARROW NAMED PATHS ONLY — push to
    # main deploys Julie's app, and app-facing markdown must keep deploying;
    # a '*.md' glob would silently skip real deploys. Skips only when EVERY
    # changed file matches; a skipped docs push deploys nothing and the next
    # code push carries it.
    paths-ignore:
      - 'todo.md'
      - 'CLAUDE.md'
      - 'docs/**'
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    # A healthy run is ~1.5 min. Without a cap a stalled step bills up to
    # GitHub's 6-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # @v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # @v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      # NO --with-deps and no install-deps (2026-11-06, same finding as
      # tom.irish): on this runner image they apt-install only font packages
      # (CJK, Thai, unifont, Cyrillic X fonts), since Chromium's libraries ship
      # with the image's own Chrome. That apt download is the run-time
      # variance -- 0s or 81s depending on the mirror, once a 6+ minute stall
      # in tom.irish. The tests use no screenshot comparisons and the site's
      # fonts are Latin, so nothing used them. If the image ever loses a library
      # Chromium needs, the tests fail loudly and nothing deploys. Each download
      # try is cut off at 3 minutes and retried once.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            timeout 180 npx playwright install chromium && exit 0
            echo "::warning::playwright install attempt $attempt timed out or failed"
          done
          exit 1

      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # @v4.1.0

      - name: Run tests
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7.0.1

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # @v5.0.0
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # @v5.0.1
