<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <title>Evolve Coaches — Catalog</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="icon" type="image/svg+xml" href="img/icon.svg">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preload" href="fonts/source-sans-pro-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-sans-pro-600.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="nav">
    <a href="catalog.html" class="brand" aria-label="Evolve Coaches Video Library"><img src="img/favicon.png" class="brand-logo" alt=""><span class="brand-name">Evolve Coaches Video Library</span></a>
    <div class="nav-links">
      <a href="catalog.html" class="active">Catalog</a>
      <a href="upload.html">Upload</a>
      <button class="nav-signout" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <main class="page">

    <div class="catalog-toolbar">
      <input type="search" id="search" placeholder="Search movements…" class="search-input">
      <button id="sort-btn" class="btn btn-sort" title="Toggle sort order">A–Z</button>
    </div>

    <!-- Loading sits where the pills will wrap, and the list starts empty, so nothing
         visible moves when the tags arrive (layout shift was 0.12 on a phone). -->
    <p class="status-msg" id="catalog-loading">Loading…</p>

    <div class="filter-bar" id="filter-bar" hidden>
      <button class="filter-pill active" data-group="All">All</button>
    </div>

    <div id="catalog-list"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
