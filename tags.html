<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <title>Evolve Coaches — Tags</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="icon" type="image/svg+xml" href="img/icon.svg">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preload" href="fonts/source-sans-pro-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-sans-pro-600.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="nav">
    <a href="catalog.html" class="brand" aria-label="Evolve Coaches Video Library"><img src="img/favicon.png" class="brand-logo" alt=""><span class="brand-name">Evolve Coaches Video Library</span></a>
    <div class="nav-links">
      <a href="catalog.html">Catalog</a>
      <a href="upload.html">Upload</a>
      <button class="nav-signout" onclick="signOut()">Sign Out</button>
    </div>
  </header>

  <main class="page">
    <h1 class="page-title">Tags</h1>
    <p class="page-subtitle">Add and rename the tags used to organise movements in the catalog.</p>

    <form id="add-form" class="admin-add-form">
      <input type="text" id="new-tag" placeholder="New tag name" required>
      <button type="submit" class="btn btn-primary admin-add-btn">Add Tag</button>
    </form>

    <div id="error-msg" class="error hidden"></div>

    <ul id="tag-list" class="admin-list">
      <li class="status-msg">Loading…</li>
    </ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tags.js"></script>
</body>
</html>
